name = "universal-ai-gateway"
main = "src/index.js"
compatibility_date = "2026-11-18"

[vars]
AI_BILLING_MODE = "free"
AI_DIRECT_PROVIDERS_ENABLED = "false"
OPENROUTER_ENABLED = "true"
FALLBACK_CHAIN = "groq,gemini,openrouter,cerebras,mistral"
# Per-project chains override FALLBACK_CHAIN. Unique Design Studio serves real users,
# so it falls back only to Groq, whose free tier allows production use.
PROJECT_FALLBACK_CHAINS = '{"unique-design-studio":"groq"}'
CF_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"

[observability]
enabled = true

[ai]
binding = "AI"

[[ratelimits]]
name = "GATEWAY_RATE_LIMITER"
namespace_id = "9026111801"

[ratelimits.simple]
limit = 30
period = 60
